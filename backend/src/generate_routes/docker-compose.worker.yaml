services:
  worker:
    container_name: routor_worker
    build:
      context: ../../
      dockerfile_inline: |
        FROM python:3.12-slim-trixie
        COPY --from=ghcr.io/astral-sh/uv:0.11.17 /uv /uvx /bin/

        ENV UV_NO_DEV=1 \
            UV_LINK_MODE=copy \
            PYTHONUNBUFFERED=1

        RUN useradd -m -u 1000 routor_user
        WORKDIR /app

        COPY --chown=routor_user:routor_user pyproject.toml uv.lock ./

        RUN --mount=type=cache,target=/root/.cache/uv \
            uv sync --locked --no-install-project --no-dev

        COPY --chown=routor_user:routor_user . /app

        RUN uv sync --locked --no-dev --no-cache

        USER routor_user

    environment:
      - CELERY_BROKER_URL=redis://routor_redis:6379/0
      - DATABASE_URL=postgresql://routor_user:routor_password@db:5432/routor_database
    command: ["uv", "run", "celery", "-A", "src.generate_routes.worker_app", "worker", "--loglevel=info"]
    networks:
      - routor_network
    volumes:
      - ../../tiles_data:/app/tiles_data:ro
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped