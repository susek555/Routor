include:
  - ./database/docker-compose.db.yaml
  - ./src/generate_routes/docker-compose.worker.yaml

networks:
  routor_network:
    driver: bridge

services:
  api:
    container_name: routor_api
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-trixie
        COPY --from=ghcr.io/astral-sh/uv:0.11.17 /uv /uvx /bin/

        ENV UV_NO_DEV=1 \
            UV_LINK_MODE=copy \
            PYTHONUNBUFFERED=1

        WORKDIR /app

        COPY pyproject.toml uv.lock ./

        RUN --mount=type=cache,target=/root/.cache/uv \
            uv sync --locked --no-install-project --no-dev

        COPY . /app
        RUN uv sync --locked --no-dev --no-cache

    environment:
      - CELERY_BROKER_URL=redis://routor_redis:6379/0
      - DATABASE_URL=postgresql://routor_user:routor_password@db:5432/routor_database
    ports:
      - "8000:8000"
    command: ["uv", "run", "main.py"]
    networks:
      - routor_network
    volumes:
      - ./tiles_data:/app/tiles_data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: routor_redis
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    networks:
      - routor_network
    restart: unless-stopped